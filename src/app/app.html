<div class="game">

  <div class="header">
    <h1>Butter Empire</h1>
  </div>

  <div class="inline">

  <div class="main-button">
    <div class="multiplier">
      <span>Butter Multiplier</span>
      <strong>{{mnoznikButter | number:'1.1-1'}}x</strong>
    </div>
    <p>YOUR BUTTER</p>
    <strong>{{licznikButter}}</strong>
       @if (criticalMessage) {
      <div class="critical-container">
        <div class="critical">
          CRITICAL!
          <span>+{{ criticalAmount }} BUTTER</span>
        </div>
      </div>
    }

    <button (click)="buyButterJeden()">
      MAKE BUTTER
    </button>
  </div>

  </div>
  <div class="upgrades">

    <div class="upgrade">
      <label>10 Butter</label>

      <button
        name="betterButter"
        (click)="buyBetterButter()"
        [disabled]="licznikButter < 10 || clickMultiplier > 1">

        Better Butter (x2 Click)

      </button>
    </div>

    <div class="upgrade">
      <label>50 Butter</label>

      <button
        name="goldenButter"
        (click)="buyGoldenButter()"
        [disabled]="licznikButter < 50 || clickMultiplier > 2">

        Golden Butter (x4 Click)

      </button>
    </div>

    <div class="upgrade">
      <label>100 Butter</label>

      <button
        name="autoButter"
        (click)="autoButter()"
        [disabled]="licznikButter < 100 || autoclicker">

        AutoButter

      </button>
    </div>

    <div class="upgrade">
      <label>500 Butter</label>

      <button
        name="betterAutoButter"
        (click)="betterAutoButter()"
        [disabled]="licznikButter < 500 || !autoclicker || autoButterMultiplier > 1">

        Better AutoButter (2x Speed)

      </button>
    </div>

    <div class="upgrade">
      <label>1,500 Butter</label>

      <button
        name="butterFactory"
        (click)="buyButterFactory()"
        [disabled]="licznikButter < 1500 || !autoclicker || autoButterMultiplier === 1 || butterFactory">

        Butter Factory (+5 butter)

      </button>
    </div>

    <div class="upgrade">
      <label>3,000 Butter</label>

      <button
        name="goldenCow"
        (click)="buyGoldenCow()"
        [disabled]="licznikButter < 3000 || goldenCow">

        Golden Cow (2x AutoButter)

      </button>
    </div>

    <div class="upgrade">
      <label>10,000 Butter</label>

      <button
        name="megaButter"
        (click)="buyMegaButter()"
        [disabled]="licznikButter < 10000 || megaButterMultiplier > 1">

        MEGA BUTTER (x2 Multiplier)

      </button>
    </div>
  </div>

  <div class="stats">
    <div class="progress">

      <p>
        Progress to {{ getNextUpgrade().name }}
      </p>

      <div class="progress-bar">
        <div
          class="progress-fill"
          [style.width.%]="getProgress()">
        </div>
      </div>

      <span>
        {{ licznikButter }} / {{ getNextUpgrade().cost }} Butter
      </span>

    </div>
</div>

</div>
